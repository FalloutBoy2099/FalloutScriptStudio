// This file contains the menu for the standard handlers,
// you can also add your own procedures here
//
// Structure:
// "procedure name"<d>"short procedure description"
// <m>"menu item"
// <-m> - close the top menu item
// <-> 	- menu separator
//
// Any characters except control characters are allowed in the "menu item" and the "short procedure description"
// The "procedure name" may contain only English letters, digits and the "_" character, and no spaces before <d>
//
// The original file was borrowed from the script constructor program "F-Geck" by Tehnokrat.
//

<m>Script actions
start<d>Called when the script is first started.
destroy_p_proc<d>Called when the object is destroyed.
spatial_p_proc<d>Called in the object's script when a critter passes over it.
timed_event_p_proc<d>Called when a previously set timer fires.

<m>Object handlers<d>Procedures that must be
look_at_p_proc<d>Short description. Called when the cursor is placed over the object.
description_p_proc<d>Detailed description. Called when the object is examined.
damage_p_proc<d>Called when the object takes damage.
use_p_proc<d>Called when the object is used.
use_obj_on_p_proc<d>Called when another object is used on this one.
use_skill_on_p_proc<d>Called when a skill is used on the object.

<m>Critter handlers
critter_p_proc<d>Responsible for the behavior of the object as a whole, executed several times per second.
talk_p_proc<d>Dialogue handler. Called when an attempt is made to talk to the object.
pickup_p_proc<d>Called when an attempt is made to steal from the critter.
push_p_proc<d>Called when an attempt is made to push the object.
combat_p_proc<d>Executed during combat.
combat_is_starting_p_proc<d>Start of combat, called when data is initialized, but does not mean that the critter is in combat (from Crafty sfall).
combat_is_over_p_proc<d>Procedure for the end of combat (from Crafty sfall).

<m>Item handlers
pickup_p_proc<d>Called when an attempt is made to pick up the item or open the container.
drop_p_proc<d>Called in the object's script when it is dropped on the ground.
is_dropping_p_proc<d>Called in the critter's script when it tries to drop an item.

<m>Map handlers
map_enter_p_proc<d>Called when the player enters the map.
map_exit_p_proc<d>Called when the player leaves the map.
map_update_p_proc<d>Called when the map is updated (every 250 game ticks).
<-m>
<->

<m>Dialogue procedures
Node000<d>Standard dialogue branch
Node001<d>Standard dialogue branch
Node998<d>Exit from the dialogue with a hostile reaction from the NPC
Node999<d>Exit from the dialogue with no response measures from the NPC
<-m>
<->

<m>Procedure templates<d>You can add your own procedure names in the file "ProcHandlers.ini"
Example(arg1, arg2)<d>
<-m>