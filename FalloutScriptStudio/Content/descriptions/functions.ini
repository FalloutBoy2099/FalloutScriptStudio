// This file contains the menu of standard functions. You can also add your own entries here
// Function descriptions are taken (for the most part) from the document "Fallout 2 Script Compiler Functions" by BIS, by Wasteland Ghost
// The easiest way to edit this file is to open it in the script editor.
//
// Structure:
// <m>"menu item"
// "function name"<d>"short function description"<s>"text to be inserted into the script"
// <m+>"submenu item"
// <m->
//
// <-> separator (top menu level only)
//
// "menu item", "function name", "short function description" and
// "text to be inserted into the script" can contain any characters except control characters
//
// <cr> is a line break and can only be used in "text to be inserted into the script"
//
// The original file was borrowed from the script constructor program "F-Geck" by Tehnokrat.
//
<m>Constructs
<m+>Keywords
call<d>Call a procedure<s>call {procedure};
call [delay]<d>Call a procedure with a delay in seconds<s>call {procedure} in {delay};
call [condition]<d>Call a procedure when a condition is true<s>call {procedure} when {condition};
return<d><s>return;<cr>
Cancel<d>[void] Cancels the pending call of a procedure in the stack<s>Cancel({procedure procedure_name});<cr>
CancelAll<d>[void] Cancels all pending procedure calls in the stack<s>CancelAll;<cr>
spawn<d>[void] Calls (spawns) the specified script<s>spawn({string int_file_name});<cr>
fork<d>[void] Calls the specified script<s>fork({string int_file_name});<cr>
wait<d>[void] Pauses the game for the specified time<s>wait({int time});<cr>
exit<d>Terminates the script in which it is called<s>exit;<cr>
critical block<d>Declares a code block as critical. Critical code is executed sequentially<s>startcritical;<cr><cr>endcritical;<cr>
<m->
<m+>Declarations
variable<d>Variable declaration<s>variable {name};
export variable<d>Variable export<s>export variable {name};
import variable<d>Variable import<s>import variable {name};
procedure<d>Procedure declaration<s>procedure {name};
export procedure<d>Procedure export<s>export procedure {name};
import procedure<d>Procedure import<s>import procedure {name};
critical procedure<d>Declares a critical procedure. Critical code is executed sequentially<s>critical procedure {name};
<m->
<m+>Conditional statements
switch<d>Conditional statement<s>switch ({condition}) begin<cr>   case {constant} : {code}<cr>   default : {code}<cr>end<cr>
if ... then ... <d>Conditional statement<s>if {condition} then
if ... then begin ... end<d>Conditional statement<s>if {condition} then begin<cr><cr>end<cr>
if ... then ... else ...<d>Conditional statement<s>if {condition} then<cr>else
if ... then ... else if ...<d>Conditional statement<s>if {condition} then<cr>else if {condition} then
if ... then begin ... end else begin ... end<d>Conditional statement<s>if {condition} then begin<cr><cr>end else begin<cr><cr>end<cr>
if ... then begin ... end else if begin ... end<d>Conditional statement<s>if {condition} then begin<cr><cr>end else if {condition} then begin<cr><cr>end<cr>
<m->
<m+>Loop statements
while ... do ...<d>Loop statement: runs while the condition is true<s>while ({condition}) do
while ... do begin...end<d>Loop statement: runs while the condition is true<s>while ({condition}) do begin<cr><cr>end<cr>
for ... begin<d>Loop statement.<s>for ({iterator} := 0; {condition}; {iterator}++) begin<cr><cr>end<cr>
foreach ... begin<d>Loop statement.<s>foreach ({item} in {array}) begin<cr><cr>end<cr>
foreach (iterator) begin<d>Loop statement with an iterator.<s>foreach ({iterator}: {item} in {array}) begin<cr><cr>end<cr>
<m->
<m+>Preprocessor directives
#define<d>Macro substitution operator<s>#define 
#include<d>Include a library<s>#include 
#ifdef ... #endif<d><s>#if <cr><cr>#else<cr><cr>#endif<cr>
#if ... #endif<d><s>#ifdef <cr><cr>#else<cr><cr>#endif<cr>
Standard *.h<d>Includes the standard libraries<s>#include "..\headers\define.h"<cr>#include "..\headers\command.h"<cr>
