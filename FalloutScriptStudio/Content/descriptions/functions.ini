<m>Script functions
<m+>General script functions
floor<d>[int] Returns the integer rounded down.<s>floor({float})
Tokenize<d>[string] Splits a string consisting of a list separated by a single character (delimiter) into substrings and returns the value for the specified token<s>Tokenize({string strMain}, {string token}, {char delimiter});
action_being_used<d>[int] Returns the number of the skill being used on the object<s>action_being_used;<cr>
dude_obj<d>[ObjectPtr] Returns a pointer to the player<s>dude_obj
fixed_param<d>[int] Returns the fixed parameter value of the script<s>fixed_param
obj_being_used_with<d>[ObjectPtr] Returns a pointer to the object currently being used on the object whose script calls this function<s>obj_being_used_with;<cr>
random<d>[int] Returns a random number in the range min...max inclusive<s>random({int min}, {int max})
scr_return<d>[void] Sets the script's return value for use by the engine's C code<s>scr_return({int value});<cr>
script_action<d>[int] Returns the action that triggered this script<s>script_action
script_overrides<d>[void] Tells the engine that the script overrides the object's default behavior<s>script_overrides;<cr>
self_obj<d>[ObjectPtr] Returns a pointer to the object whose script is running<s>self_obj
source_obj<d>[ObjectPtr] Returns a pointer to the object that called the handler<s>source_obj
target_obj<d>[ObjectPtr] Returns a pointer to the object being acted upon<s>target_obj
