<m+>Timer events
add_timer_event<d>[void] Adds a timer event<s>add_timer_event({ObjectPtr obj}, {int time}, {int info});<cr>
rm_timer_event<d>[void] Clears all timer events attached to this object<s>rm_timer_event({ObjectPtr who});<cr>
rm_fixed_timer_event<d>[void] Clears timer events attached to the specified object<s>rm_fixed_timer_event({ObjectPtr who}, {int fixed_val});<cr>
<m+>Macros
flush_add_timer_event<d>[void] Clears all timer events attached to the specified object and adds a new event to it.<s>flush_add_timer_event({ObjectPtr who}, {int time},{int fixed_param});<cr>
flush_add_timer_event_sec<d>[void] Clears all timer events attached to the specified object and adds a new event to it, with the delay in seconds.<s>flush_add_timer_event_sec({ObjectPtr who}, {int sec_time},{int fixed_param});<cr>
